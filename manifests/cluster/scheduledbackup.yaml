# Weekly full backup, matching the source TARS weekly backup intent.
# With the Barman Cloud CNPG-I plugin, ScheduledBackup uses method=plugin.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: tarsdb-weekly-full
  namespace: tars-db
spec:
  schedule: "0 0 22 * * 0"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: tarsdb-primary
