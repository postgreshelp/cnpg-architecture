# CNPG Cluster — the primary HA pair. instances:2 = primary + one async streaming replica,
# same shape as TARS "Primary pod (read-write) + Async replica pod (read-only, not
# read-serving)" in the source diagram.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tarsdb-primary
  namespace: tars-db
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:15.6   # matches TARS's PostgreSQL 15.6
  # To pull an EDB-supported / EDB Postgres Advanced Server image instead:
  #   1. Run scripts/setup-edb-registry.sh once (creates the edb-registry-creds secret)
  #   2. Change imageName above to your EDB registry image, and uncomment:
  # imagePullSecrets:
  #   - name: edb-registry-creds

  primaryUpdateStrategy: unsupervised   # rolling updates auto-promote; use "supervised" if you
                                        # want to manually confirm every minor-version rollout

  superuserSecret:
    name: tarsdb-primary-superuser
  enableSuperuserAccess: true   # required: CNPG defaults this to false and leaves the postgres
                                 # role's password unset otherwise, even with superuserSecret
                                 # configured — the connection monitor needs postgres-level access

  bootstrap:
    initdb:
      database: tars
      owner: tars_admin
      secret:
        name: tarsdb-app-user   # app-user credentials — generated by scripts/generate-secrets.sh,
                                 # NOT left to CNPG's auto-generated default, so the one-click
                                 # deploy can read this password back for the data-load step

  storage:
    size: 8Gi                   # POC override for an 8GB-RAM laptop; production target is 500Gi
    storageClass: standard      # swap for your real StorageClass (e.g. ibm-spectrum-fusion equivalent) in prod

  # ---- PostgreSQL parameters — transcribed directly from TARS §6.2 patronictl show-config ----
  postgresql:
    parameters:
      # POC-only memory reductions: the architecture remains the same, but these avoid OOM on an 8GB host.
      max_connections: "50"
      shared_buffers: "512MB"
      effective_cache_size: "1GB"
      work_mem: "4MB"
      maintenance_work_mem: "128MB"
      max_wal_size: "512MB"
      min_wal_size: "80MB"
      checkpoint_completion_target: "0.9"
      effective_io_concurrency: "2"
      random_page_cost: "4"
      max_parallel_workers: "2"
      max_parallel_workers_per_gather: "2"
      max_worker_processes: "4"
      wal_level: "logical"
      archive_mode: "on"
      archive_timeout: "3min"
      password_encryption: "scram-sha-256"
      huge_pages: "off"
      jit: "off"
      log_destination: "csvlog"
      logging_collector: "on"
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"
      log_lock_waits: "on"
      log_autovacuum_min_duration: "0"
      log_min_duration_statement: "10s"
      log_statement: "ddl"
      log_temp_files: "0"
      log_line_prefix: "%m [%p]%q %d "
      # NOTE: TARS also loads pgnodemx + pgnodemx.kdapi_path — that library reads OpenShift/
      # container cgroup info and is Crunchy-image-specific; there's no CNPG equivalent, so it's
      # intentionally dropped here rather than faked.

    # ---- pg_hba — transcribed and adapted from TARS §6.3 ----
    # CNPG injects its own internal rules (replication, healthcheck) automatically; these are
    # appended for application/client access, matching TARS's scram-sha-256 + TLS posture.
    pg_hba:
      - hostssl all all all scram-sha-256

  replicationSlots:
    highAvailability:
      enabled: false   # matches TARS "Replication slots: No" — see docs/01-architecture-theory.md
                        # for the tradeoff this implies before you change it

  # ---- Backup: Barman Cloud CNPG-I plugin to MinIO, replacing Crunchy pgBackRest repo2 ----
  # The ObjectStore is defined separately in manifests/backup/objectstore-primary.yaml.
  # CNPG 1.30 is used for this POC; in-tree barmanObjectStore is intentionally not used.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: tarsdb-primary-store
        serverName: tarsdb-primary

  monitoring:
    enablePodMonitor: true      # requires the Prometheus operator in-cluster to actually scrape;
                                 # see manifests/monitoring/podmonitor-note.md if you haven't got one

  # POC resource profile for an 8GB-RAM laptop. Restore production sizing separately.
  # CPU further reduced from 500m/1 to fit a 2-vCPU host: 2 instances x 500m alone would
  # equal the entire node's allocatable CPU, leaving zero room for MinIO/pooler/DR/system pods.
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"           # POC limit; production target is 24Gi per node
