# Barman Cloud CNPG-I ObjectStore for the TARS primary cluster.
# This is the CNPG replacement for Crunchy/pgBackRest repo2 (MinIO).
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: tarsdb-primary-store
  namespace: tars-db
spec:
  configuration:
    destinationPath: "s3://postgresbackup/"
    endpointURL: "http://minio.minio:9000"
    s3Credentials:
      accessKeyId:
        name: minio-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-creds
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
      maxParallel: 4
    data:
      compression: gzip
  retentionPolicy: "14d"
